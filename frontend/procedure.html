<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What do you need? | Lincoln Financial</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <p class="brand-name">Lincoln Financial</p>
  </header>

  <main class="card">
    <div class="progress"><span id="progress"></span></div>
    <p class="step" id="step-label"></p>
    <!-- Heading comes from the chosen category's `prompt`. -->
    <h1 id="heading"></h1>

    <div class="summary-group">
      <p class="summary">
        <span>Location: <strong id="location-text"></strong></span>
        <a class="link" href="location.html">Change</a>
      </p>
      <p class="summary">
        <span>Office: <strong id="office-text"></strong></span>
        <a class="link" href="office.html">Change</a>
      </p>
      <p class="summary">
        <span>Care type: <strong id="category-text"></strong></span>
        <a class="link" href="category.html">Change</a>
      </p>
    </div>

    <form id="procedure-form">
      <fieldset>
        <legend>Select one</legend>
        <div id="procedure-options"></div>
      </fieldset>
      <button type="submit" id="continue" class="btn" disabled>Continue</button>
    </form>
  </main>

  <script src="js/options.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/api.js"></script>
  <script type="module" src="js/firebase.js"></script>
  <script src="js/procedure.js"></script>
</body>
</html>
