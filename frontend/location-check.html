<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Still here? | Lincoln Financial</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <p class="brand-name">Lincoln Financial</p>
  </header>

  <!-- Update info, step 2: keep the saved location, or enter a new one on
       location.html (see UPDATE in js/shared.js). -->
  <main class="card">
    <div class="progress"><span id="progress"></span></div>
    <p class="step" id="step-label"></p>
    <h1 id="heading"></h1>
    <p class="lead">We use this to suggest dental offices near you.</p>

    <div class="summary-group" id="summary-group">
      <p class="summary">
        <span>Your dental office: <strong id="office-text"></strong></span>
      </p>
    </div>

    <form id="location-check-form">
      <fieldset>
        <legend>Select one</legend>
        <div id="location-check-options"></div>
      </fieldset>
      <button type="submit" id="continue" class="btn" disabled>Continue</button>
    </form>
  </main>

  <script src="js/options.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/api.js"></script>
  <script type="module" src="js/firebase.js"></script>
  <script src="js/location-check.js"></script>
</body>
</html>
