<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose an office | Lincoln Financial</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <p class="brand-name">Lincoln Financial</p>
  </header>

  <main class="card">
    <div class="progress"><span id="progress"></span></div>
    <p class="step" id="step-label"></p>
    <h1>Choose a dental office near you</h1>

    <div class="summary-group">
      <p class="summary">
        <span>Location: <strong id="location-text"></strong></span>
        <a class="link" href="location.html">Change</a>
      </p>
    </div>

    <!-- Shown instead of the form when the backend returned no offices. -->
    <p class="note" id="no-offices" role="status" hidden>
      We couldn't find any dental offices near this location. Try a different state or ZIP code.
    </p>

    <form id="office-form">
      <fieldset>
        <legend>Select one</legend>
        <div id="office-options"></div>
      </fieldset>
      <button type="submit" id="continue" class="btn" disabled>Continue</button>
    </form>
  </main>

  <script src="js/options.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/api.js"></script>
  <script type="module" src="js/firebase.js"></script>
  <script src="js/office.js"></script>
</body>
</html>
