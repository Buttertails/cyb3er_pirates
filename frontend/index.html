<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Where are you? | Lincoln Financial</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="card">
    <p class="step">Step 1 of 2</p>
    <h1>Where are you located?</h1>
    <p class="lead">We use this to find options near you.</p>

    <form id="location-form" novalidate>
      <div class="field">
        <label for="state">State</label>
        <select id="state" name="state" autocomplete="address-level1" required aria-describedby="state-error">
          <option value="">Select a state</option>
        </select>
        <p class="error" id="state-error" role="alert" hidden>Please select a state.</p>
      </div>

      <div class="field">
        <label for="zip">ZIP code <span class="optional">(optional)</span></label>
        <input id="zip" name="zip" type="text" inputmode="numeric" maxlength="5"
               autocomplete="postal-code" aria-describedby="zip-error">
        <p class="error" id="zip-error" role="alert" hidden>Enter a 5-digit ZIP code, or leave it blank.</p>
      </div>

      <button type="submit" class="btn">Continue</button>
    </form>
  </main>

  <script src="js/options.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/location.js"></script>
</body>
</html>
