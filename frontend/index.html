<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Lincoln Financial</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <p class="brand-name">Lincoln Financial</p>
  </header>

  <main class="card">
    <!-- MOCK LOGIN: nothing is verified. Replace with real authentication. -->
    <p class="temp-banner">
      <strong>Mock login.</strong> Any username and password works. Nothing is checked
      or sent anywhere, and the password is never kept.
    </p>

    <h1>Sign in</h1>
    <p class="lead">Sign in to find a dental office and get started.</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username"
               autocapitalize="none" spellcheck="false" aria-describedby="username-error">
        <p class="error" id="username-error" role="alert" hidden></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
               aria-describedby="password-error">
        <p class="error" id="password-error" role="alert" hidden></p>
      </div>

      <button type="submit" class="btn">Sign in</button>
    </form>
  </main>

  <script src="js/options.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
