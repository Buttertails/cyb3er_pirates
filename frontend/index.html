<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Lincoln Financial</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <p class="brand-name">Lincoln Financial</p>
  </header>

  <main class="card">
    <!-- TEMPORARY until the app is deployed: see DEMO_LOGIN in js/shared.js. -->
    <p class="temp-banner" id="demo-login" hidden>
      <strong>Demo sign-in.</strong> Any email and password works. Nothing is checked
      or sent, and your location is remembered in this browser only.
    </p>

    <p class="note" id="signed-out" role="status" hidden>You were signed out. Please sign in again.</p>

    <h1 id="auth-title">Sign in</h1>
    <p class="lead" id="auth-lead">Sign in to find a dental office and get started.</p>

    <!-- One form for both modes: "Create an account" reveals the confirm fields. -->
    <form id="auth-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email"
               autocapitalize="none" spellcheck="false" aria-describedby="email-error">
        <p class="error" id="email-error" role="alert" hidden></p>
      </div>

      <div class="field" id="confirm-email-field" hidden>
        <label for="confirm-email">Confirm email</label>
        <input id="confirm-email" name="confirm-email" type="email" autocomplete="email"
               autocapitalize="none" spellcheck="false" aria-describedby="confirm-email-error">
        <p class="error" id="confirm-email-error" role="alert" hidden></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
               aria-describedby="password-error">
        <p class="error" id="password-error" role="alert" hidden></p>
      </div>

      <div class="field" id="confirm-password-field" hidden>
        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password"
               aria-describedby="confirm-password-error">
        <p class="error" id="confirm-password-error" role="alert" hidden></p>
      </div>

      <button type="submit" class="btn" id="auth-submit">Sign in</button>
    </form>

    <p class="form-switch">
      <span id="switch-text">New here?</span>
      <button type="button" class="link-btn" id="switch-mode">Create an account</button>
    </p>
  </main>

  <script src="js/options.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/api.js"></script>
  <script type="module" src="js/firebase.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
