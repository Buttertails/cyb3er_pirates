<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review | Lincoln Financial</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <p class="brand-name">Lincoln Financial</p>
  </header>

  <main class="card">
    <div class="progress"><span id="progress"></span></div>
    <p class="step">Review</p>
    <h1>Here's what you told us</h1>

    <!-- Shown only for emergency work. -->
    <p class="note" id="emergency-note" hidden>
      This is emergency care, so we've marked it as needed right away.
    </p>

    <div class="summary-group">
      <p class="summary">
        <span>Location: <strong id="location-text"></strong></span>
        <a class="link" href="index.html">Change</a>
      </p>
      <p class="summary">
        <span>Care type: <strong id="category-text"></strong></span>
        <a class="link" href="category.html">Change</a>
      </p>
      <p class="summary">
        <span>Procedure: <strong id="procedure-text"></strong></span>
        <a class="link" href="procedure.html">Change</a>
      </p>
      <p class="summary" id="timing-row">
        <span>Timing: <strong id="timing-text"></strong></span>
        <a class="link" href="timing.html" id="timing-change">Change</a>
      </p>
    </div>

    <!-- TODO: replace this placeholder with the real submit / backend call. -->
    <button type="button" class="btn" id="submit">Submit request</button>
    <p class="note" id="submitted" role="status" hidden>
      Placeholder: this is where the request would be sent.
    </p>

    <p class="actions"><a class="link" href="index.html" id="start-over">Start over</a></p>
  </main>

  <script src="js/options.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/confirm.js"></script>
</body>
</html>
