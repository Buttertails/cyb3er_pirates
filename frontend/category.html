<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What kind of care? | Lincoln Financial</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <p class="brand-name">Lincoln Financial</p>
  </header>

  <main class="card">
    <div class="progress"><span id="progress"></span></div>
    <p class="step" id="step-label"></p>
    <h1>What kind of care do you need?</h1>

    <div class="summary-group">
      <p class="summary">
        <span>Location: <strong id="location-text"></strong></span>
        <a class="link" href="index.html">Change</a>
      </p>
    </div>

    <form id="category-form">
      <fieldset>
        <legend>Select one</legend>
        <div id="category-options"></div>
      </fieldset>
      <button type="submit" id="continue" class="btn" disabled>Continue</button>
    </form>
  </main>

  <script src="js/options.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/category.js"></script>
</body>
</html>
