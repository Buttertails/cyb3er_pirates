<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recent dental work | Lincoln Financial</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <p class="brand-name">Lincoln Financial</p>
  </header>

  <!-- Update info, step 1: the user says whether they've had dental work, and
       adds each procedure if so (see UPDATE in js/shared.js). -->
  <main class="card">
    <div class="progress"><span id="progress"></span></div>
    <p class="step" id="step-label"></p>

    <!-- Shown when the update was started by the 90-day sign-in check. -->
    <p class="note" id="stale-note" role="status" hidden>
      It's been more than 90 days since you last signed in. Before you continue,
      tell us about any dental work you've had since then.
    </p>

    <h1>Any recent dental work?</h1>
    <p class="lead">This keeps your coverage estimates accurate.</p>

    <div id="on-file" hidden>
      <h2 class="subhead">Already on file</h2>
      <div class="summary-group" id="on-file-list"></div>
    </div>

    <form id="procedures-form" novalidate>
      <fieldset>
        <legend id="had-work-legend"></legend>
        <div id="had-work-options"></div>
      </fieldset>

      <fieldset id="add-procedure" hidden>
        <legend>Add a procedure</legend>

        <div class="field">
          <label for="procedure">Procedure</label>
          <select id="procedure" name="procedure" aria-describedby="procedure-error">
            <option value="">Select a procedure</option>
          </select>
          <p class="error" id="procedure-error" role="alert" hidden></p>
        </div>

        <div class="field">
          <label for="date">Month it was done</label>
          <input id="date" name="date" type="month" aria-describedby="date-error">
          <p class="error" id="date-error" role="alert" hidden></p>
        </div>

        <div class="field">
          <label for="cost">Total cost in dollars <span class="optional">(optional)</span></label>
          <input id="cost" name="cost" type="text" inputmode="decimal" aria-describedby="cost-error">
          <p class="error" id="cost-error" role="alert" hidden></p>
        </div>

        <div class="field">
          <label for="you-paid">You paid <span class="optional">(optional)</span></label>
          <input id="you-paid" name="you-paid" type="text" inputmode="decimal" aria-describedby="you-paid-error">
          <p class="error" id="you-paid-error" role="alert" hidden></p>
        </div>

        <div class="field">
          <label for="insurance-paid">Insurance paid <span class="optional">(optional)</span></label>
          <input id="insurance-paid" name="insurance-paid" type="text" inputmode="decimal"
                 aria-describedby="insurance-paid-error">
          <p class="error" id="insurance-paid-error" role="alert" hidden></p>
        </div>

        <button type="button" class="btn btn-secondary" id="add">Add procedure</button>
      </fieldset>

      <!-- Procedures added on this visit, each with a Remove button. -->
      <div class="summary-group" id="added-list" hidden></div>

      <button type="submit" class="btn" id="continue" disabled>Continue</button>
    </form>
  </main>

  <script src="js/options.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/api.js"></script>
  <script type="module" src="js/firebase.js"></script>
  <script src="js/procedures.js"></script>
</body>
</html>
